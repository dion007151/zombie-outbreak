<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Zombie Outbreak</title>
    
    <!-- Open Graph / Facebook Meta Tags for sharing preview banner -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zombie Outbreak" />
    <meta property="og:description" content="Survive the halls. Find the exit. Redesigned pixel-art zombie survival experience." />
    <meta property="og:image" content="https://zombie-outbreak-six.vercel.app/assets/game_banner.png" />
    <meta property="og:url" content="https://zombie-outbreak-six.vercel.app" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zombie Outbreak" />
    <meta name="twitter:description" content="Survive the halls. Find the exit. Redesigned pixel-art zombie survival experience." />
    <meta name="twitter:image" content="https://zombie-outbreak-six.vercel.app/assets/game_banner.png" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell" aria-label="Zombie Outbreak game">
      <canvas id="game" width="800" height="600"></canvas>

      <!-- Redesigned Title Screen / Menu Overlay -->
      <section id="menu" class="menu">
        <!-- Canvas for title menu fog, dust, and visual horror effects -->
        <canvas id="menuEffects" class="menu-effects"></canvas>

        <div class="menu-content-wrapper">
          <div class="brand">
            <h1 id="logoContainer">
              <span class="logo-text">Zombie Outbreak</span>
              <span class="blood-drips"></span>
            </h1>
            <p class="subtitle">Survive the halls. Find the exit.</p>
            <p class="credit">Made by Dionimar Flores</p>
          </div>

          <!-- Title screen main navigation buttons -->
          <div id="mainMenuActions" class="actions">
            <button id="playBtn" class="menu-btn" type="button">PLAY</button>
            <button id="settingsBtn" class="menu-btn" type="button">SETTINGS</button>
            <button id="exitBtn" class="menu-btn" type="button">EXIT</button>
          </div>

          <!-- Character selection screen - Hidden initially, appears when pressing PLAY -->
          <div id="characterSelectContainer" class="character-select-screen hidden">
            <h2 class="section-title">SELECT SURVIVOR</h2>
            <div id="characterSelect" class="character-select" role="radiogroup" aria-label="Choose character">
              <button id="boyCharacter" class="character-option selected" type="button" aria-pressed="true" data-character="boy">
                <div class="img-frame">
                  <img src="assets/character-boy.png" alt="Boy Survivor" />
                </div>
                <span>Boy</span>
              </button>
              <button id="girlCharacter" class="character-option" type="button" aria-pressed="false" data-character="girl">
                <div class="img-frame">
                  <img src="assets/character-girl.png" alt="Girl Survivor" />
                </div>
                <span>Girl</span>
              </button>
            </div>
            <div class="character-actions">
              <button id="confirmCharacterBtn" class="menu-btn" type="button">START GAME</button>
              <button id="backToMenuBtn" class="menu-btn secondary-btn" type="button">BACK</button>
            </div>
          </div>

          <!-- Settings panel -->
          <div id="settingsPanel" class="settings-panel hidden">
            <h2 class="section-title">SETTINGS</h2>
            <div class="setting-item">
              <label for="masterVolumeRange">MASTER VOLUME</label>
              <input type="range" id="masterVolumeRange" min="0" max="100" value="50" />
            </div>
            <div class="setting-item">
              <label for="musicToggle">AMBIENT OST</label>
              <input type="checkbox" id="musicToggle" checked />
            </div>
            <div class="setting-item">
              <label for="fxToggle">SOUND EFFECTS</label>
              <input type="checkbox" id="fxToggle" checked />
            </div>
            <button id="closeSettingsBtn" class="menu-btn" type="button">CLOSE</button>
          </div>
        </div>
      </section>

      <section id="touchControls" class="touch-controls hidden" aria-label="Touch controls">
        <div id="movePad" class="move-pad" aria-label="Move">
          <div id="moveKnob" class="move-knob"></div>
        </div>
        <button id="shootButton" class="shoot-button" type="button" aria-label="Shoot"></button>
      </section>
    </main>

    <audio id="music" src="Fear & Hunger 2_ Termina OST - Dark Outside.mp3" preload="auto" loop></audio>
    <script src="game.js"></script>
  </body>
</html>
